<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/book-wise.svg" />
    <link
      rel="preload"
      as="font"
      href="/fonts/inter-400.woff2"
      type="font/woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      })();

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
